[project]
name = "infer-eval"
version = "0.1.0"
description = "Evaluation scenarios, executable reference solutions and graders for LLM inference / GPU systems reasoning"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
infer-eval = "infer_eval.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
